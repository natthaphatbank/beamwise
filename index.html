<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Beamwise — ออกแบบ Wi-Fi แม่นยำ ก่อนติดตั้งจริง</title>
  <meta name="description" content="วาง Access Point บนแบบแปลน ดู Heatmap สัญญาณ Wi-Fi 2.4/5 GHz ทันที ฟรี ใช้งานบนเว็บได้เลย สำหรับช่างติดตั้ง ร้านไอที และเจ้าของหอพัก — Free predictive Wi-Fi planner.">
  <meta name="theme-color" content="#161c26">
  <meta name="color-scheme" content="dark light">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("wpth-theme")==="light"?"light":"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>

  <meta property="og:type" content="website">
  <meta property="og:title" content="Beamwise — ออกแบบ Wi-Fi แม่นยำ ก่อนติดตั้งจริง">
  <meta property="og:description" content="วาง AP บนแบบแปลน ดูสัญญาณ Wi-Fi ทันที ฟรีบนเว็บ ไม่ต้องติดตั้ง">
  <meta property="og:image" content="https://natthaphatbank.github.io/beamwise/og-image.png">
  <meta property="og:url" content="https://natthaphatbank.github.io/beamwise/">
  <meta property="og:locale" content="th_TH">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/favicon.svg" width="24" height="24" alt="">
      <span>Beam<b>wise</b></span>
    </div>
    <div class="actions">
      <div class="group">
        <button id="btnNew" data-i18n="new"></button>
        <button id="btnOpen" data-i18n="open"></button>
        <button id="btnSave" data-i18n="save"></button>
      </div>
      <span class="vsep"></span>
      <button id="btnPlan" data-i18n="loadPlan"></button>
      <button id="btnExportData" data-i18n="exportData"></button>
      <button id="btnExport" class="primary" data-i18n="exportPng"></button>
      <span class="vsep"></span>
      <button id="btnInstall" class="primary-outline" data-i18n="installApp" hidden></button>
      <button id="btnHelp" data-i18n="help"></button>
      <button id="btnTheme" class="icon-btn" aria-label="Theme"><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <label class="lang-sel" data-i18n-title="language">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        <select id="langSel" aria-label="Language / ภาษา"></select>
      </label>
    </div>
    <input type="file" id="filePlan" accept="image/*,application/pdf,.pdf" hidden>
    <input type="file" id="fileOpen" accept=".json,application/json" hidden>
  </header>

  <main class="layout collapsed" id="layout">
    <nav class="tools" id="tools">
      <button data-tool="select" data-i18n-title="toolSelect"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z"/></svg><span class="tl" data-i18n="tlSelect"></span></button>
      <button data-tool="pan" data-i18n-title="toolPan"><svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"/></svg><span class="tl" data-i18n="tlPan"></span></button>
      <button data-tool="scale" data-i18n-title="toolScale"><svg viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21zM7 13l2 2M10 10l2 2M13 7l2 2"/></svg><span class="tl" data-i18n="tlScale"></span></button>
      <button data-tool="wall" data-i18n-title="toolWall"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zM3 12h18M9 5v7M15 12v7"/></svg><span class="tl" data-i18n="tlWall"></span></button>
      <button data-tool="area" data-i18n-title="toolArea"><svg viewBox="0 0 24 24"><path d="M4 6l7-3 9 5-2 11-12 2z" stroke-dasharray="3 2.5"/><circle cx="4" cy="6" r="1.6"/><circle cx="20" cy="8" r="1.6"/><circle cx="6" cy="21" r="1.6"/></svg><span class="tl" data-i18n="tlArea"></span></button>
      <button data-tool="ap" data-i18n-title="toolAp"><svg viewBox="0 0 24 24"><circle cx="12" cy="15" r="2"/><path d="M8 11a6 6 0 0 1 8 0M5 8a10 10 0 0 1 14 0"/></svg><span class="tl" data-i18n="tlAp"></span></button>
      <button data-tool="survey" data-i18n-title="toolSurvey"><svg viewBox="0 0 24 24"><path d="M12 3l6 6-6 6-6-6z"/><path d="M12 15v6M8 21h8"/></svg><span class="tl" data-i18n="tlSurvey"></span></button>
      <div class="sep"></div>
      <button id="btnUndo" data-i18n-title="undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"/></svg><span class="tl" data-i18n="tlUndo"></span></button>
      <button id="btnRedo" data-i18n-title="redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H9a5 5 0 0 0 0 10h3"/></svg><span class="tl" data-i18n="tlRedo"></span></button>
      <button id="btnFit" data-i18n-title="fit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="tl" data-i18n="tlFit"></span></button>
    </nav>

    <section class="stage" id="stage">
      <canvas id="canvas"></canvas>
      <div class="hint" id="hint"></div>
      <button class="finish-wall" id="btnFinishWall" hidden></button>
      <button class="ortho-btn" id="btnOrtho" hidden aria-pressed="true"></button>
    </section>

    <aside class="panel">
      <section class="card" id="propsCard">
        <h3 id="propsTitle"></h3>
        <div id="props"></div>
      </section>

      <section class="card" id="keysCard" hidden>
        <h3 data-i18n="keysTitle"></h3>
        <dl class="keys" id="keysList"></dl>
        <button class="btn" id="keysHelp" data-i18n="keysMore"></button>
      </section>

      <section class="card" id="summaryCard">
        <h3 data-i18n="summary"></h3>
        <div class="stats" id="stats"></div>
      </section>

      <section class="card" id="calibCard" hidden>
        <h3 data-i18n="calibTitle"></h3>
        <div id="calib"></div>
      </section>

      <section class="card" id="aiCard">
        <h3 data-i18n="aiTitle"></h3>
        <label class="row"><span data-i18n="aiModelUsed"></span><select id="aiModel"></select></label>
        <div id="aiModelSearchBox"></div>
        <label class="row"><span data-i18n="aiTarget"></span>
          <select id="aiTarget"><option value="0.9">90%</option><option value="0.95" selected>95%</option><option value="0.99">99%</option></select>
        </label>
        <label class="row"><span data-i18n="aiMaxAps"></span><input type="number" id="aiMax" min="1" max="50" value="12"></label>
        <label class="row check"><span data-i18n="aiKeep"></span><input type="checkbox" id="aiKeep"></label>
        <button class="btn primary" id="btnAutoPlace" data-i18n="aiAutoPlace"></button>
        <div class="progress" id="aiProgress" hidden><div></div></div>
        <button class="btn" id="btnChannels" data-i18n="aiChannels"></button>
      </section>

      <section class="card" id="displayCard">
        <h3 data-i18n="display"></h3>
        <label class="row"><span data-i18n="band"></span>
          <div class="seg" id="bandSeg">
            <button data-band="2.4">2.4 GHz</button>
            <button data-band="5">5 GHz</button>
          </div>
        </label>
        <label class="row"><span data-i18n="environment"></span>
          <select id="envSel"></select>
        </label>
        <label class="row"><span data-i18n="opacity"></span>
          <input type="range" id="opacity" min="0.1" max="0.9" step="0.05">
        </label>
        <label class="row"><span data-i18n="requirement"></span>
          <select id="reqSel"></select>
        </label>
        <label class="row check"><span data-i18n="waves"></span><input type="checkbox" id="wavesChk"></label>
        <details class="adv" id="advBox">
          <summary data-i18n="advanced"></summary>
          <label class="row"><span data-i18n="minSignal"></span>
            <select id="minSel"></select>
          </label>
          <label class="row"><span data-i18n="clientDevice"></span><select id="clientSel"></select></label>
          <label class="row"><span><span data-i18n="clientHeight"></span> <span class="u">(m)</span></span><input type="number" id="clientH" min="0" max="10" step="0.1"></label>
          <label class="row"><span data-i18n="margin"></span><select id="marginSel"></select></label>
          <label class="row check"><span data-i18n="pathsOpt"></span><input type="checkbox" id="pathsChk"></label>
          <label class="row check"><span data-i18n="capNbtc"></span><input type="checkbox" id="capNbtc"></label>
          <label class="row check"><span data-i18n="rulers"></span><input type="checkbox" id="rulersChk"></label>
        </details>
      </section>

      <section class="card" id="legendCard">
        <h3 data-i18n="legend"></h3>
        <div class="legend" id="legend"></div>
      </section>

      <p class="disclaimer" data-i18n="disclaimer"></p>
    </aside>
  </main>

  <footer class="status">
    <span id="stCursor">—</span>
    <span id="stScale"></span>
    <span id="stMsg"></span>
  </footer>

  <div class="modal-back" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" id="modalBox"></div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/model.js"></script>
  <script src="js/optimizer.js"></script>
  <script src="js/survey.js"></script>
  <script src="js/report.js"></script>
  <script src="js/pdfplan.js"></script>
  <script src="js/sample.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
