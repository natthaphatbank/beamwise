<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Beamwise</title>
  <meta name="description" content="วาง Access Point บนแบบแปลน ดู Heatmap สัญญาณ Wi-Fi 2.4/5 GHz ทันที ฟรี ใช้งานบนเว็บได้เลย สำหรับช่างติดตั้ง ร้านไอที และเจ้าของหอพัก — Free predictive Wi-Fi planner.">
  <meta name="theme-color" content="#161c26">
  <meta name="color-scheme" content="dark light">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("wpth-theme")==="light"?"light":"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>

  <meta property="og:type" content="website">
  <meta property="og:title" content="Beamwise">
  <meta property="og:description" content="วาง AP บนแบบแปลน ดูสัญญาณ Wi-Fi ทันที ฟรีบนเว็บ ไม่ต้องติดตั้ง">
  <meta property="og:image" content="https://natthaphatbank.github.io/beamwise/og-image.png">
  <meta property="og:url" content="https://natthaphatbank.github.io/beamwise/">
  <meta property="og:locale" content="th_TH">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pro.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/favicon.svg" width="24" height="24" alt="">
      <span>Beam<b>wise</b></span>
    </div>
    <button id="btnMenu" class="menu-btn" aria-expanded="false" aria-controls="actions" data-i18n-title="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span data-i18n="menu"></span></button>
    <div class="actions" id="actions">
      <details class="filemenu" id="fileMenu">
        <summary><span data-i18n="fileMenu"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
        <div class="menu-pop">
          <button id="btnNew" data-i18n="new"></button>
          <button id="btnTemplates" data-i18n="tplBtn"></button>
          <button id="btnOpen" data-i18n="open"></button>
          <button id="btnPlan" data-i18n="loadPlan"></button>
        </div>
      </details>
      <button id="btnSave" data-i18n="save"></button>
      <button id="btnExportMenu" class="primary" data-i18n="expBtn"></button>
      <span class="vsep"></span>
      <button id="btnInstall" class="primary-outline" data-i18n="installApp" hidden></button>
      <button id="btnHelp" data-i18n="help"></button>
      <button id="btnTheme" class="icon-btn" aria-label="Theme"><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <label class="lang-sel" data-i18n-title="language">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        <select id="langSel" aria-label="Language / ภาษา"></select>
      </label>
    </div>
    <input type="file" id="filePlan" accept="image/*,application/pdf,.pdf,.dxf" hidden>
    <input type="file" id="fileOpen" accept=".json,application/json" hidden>
    <input type="file" id="fileSurvey" accept=".csv,.txt,text/csv" hidden>
  </header>

  <main class="layout collapsed" id="layout">
    <nav class="tools" id="tools">
      <button data-tool="select" data-i18n-title="toolSelect"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z"/></svg><span class="tl" data-i18n="tlSelect"></span></button>
      <button data-tool="pan" data-i18n-title="toolPan"><svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"/></svg><span class="tl" data-i18n="tlPan"></span></button>
      <div class="sep"></div>
      <button data-tool="scale" data-i18n-title="toolScale"><svg viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21zM7 13l2 2M10 10l2 2M13 7l2 2"/></svg><span class="tl" data-i18n="tlScale"></span></button>
      <button data-tool="wall" data-i18n-title="toolWall"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zM3 12h18M9 5v7M15 12v7"/></svg><span class="tl" data-i18n="tlWall"></span></button>
      <button data-tool="door" data-i18n-title="toolDoor"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 20V4h9v16"/><path d="M15 4a9 9 0 0 1 0 16" stroke-dasharray="2.5 2"/><circle cx="12.5" cy="12" r="0.9"/></svg><span class="tl" data-i18n="tlDoor"></span></button>
      <button data-tool="area" data-i18n-title="toolArea"><svg viewBox="0 0 24 24"><path d="M4 6l7-3 9 5-2 11-12 2z" stroke-dasharray="3 2.5"/><circle cx="4" cy="6" r="1.6"/><circle cx="20" cy="8" r="1.6"/><circle cx="6" cy="21" r="1.6"/></svg><span class="tl" data-i18n="tlArea"></span></button>
      <button data-tool="opening" data-i18n-title="toolOpening"><svg viewBox="0 0 24 24"><path d="M3 8l9-4 9 4-9 4z"/><path d="M3 16l9-4 9 4-9 4z"/><path d="M9 10.5l6 3M15 10.5l-6 3" stroke-dasharray="2 1.5"/></svg><span class="tl" data-i18n="tlOpening"></span></button>
      <button data-tool="atten" data-i18n-title="toolAtten"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M4 11l6-6M4 17l12-12M8 19l12-12M14 19l6-6"/></svg><span class="tl" data-i18n="tlAtten"></span></button>
      <div class="sep"></div>
      <button data-tool="ap" data-i18n-title="toolAp"><svg viewBox="0 0 24 24"><circle cx="12" cy="15" r="2"/><path d="M8 11a6 6 0 0 1 8 0M5 8a10 10 0 0 1 14 0"/></svg><span class="tl" data-i18n="tlAp"></span></button>
      <button data-tool="probe" data-i18n-title="toolProbe"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><span class="tl" data-i18n="tlProbe"></span></button>
      <div class="sep"></div>
      <button data-tool="note" data-i18n-title="toolNote"><svg viewBox="0 0 24 24"><path d="M12 22s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><path d="M9 9h6M9 12h4"/></svg><span class="tl" data-i18n="tlNote"></span></button>
      <button data-tool="measure" data-i18n-title="toolMeasure"><svg viewBox="0 0 24 24"><path d="M2 16l14-14 6 6-14 14z"/><path d="M6 12l2 2M9 9l3 3M12 6l2 2"/></svg><span class="tl" data-i18n="tlMeasure"></span></button>
      <button data-tool="survey" data-i18n-title="toolSurvey"><svg viewBox="0 0 24 24"><path d="M12 3l6 6-6 6-6-6z"/><path d="M12 15v6M8 21h8"/></svg><span class="tl" data-i18n="tlSurvey"></span></button>
    </nav>

    <section class="stage" id="stage">
      <canvas id="canvas"></canvas>
      <div class="viewdock" id="viewDock">
        <div class="vd-row">
          <div class="seg" id="bandSeg">
            <button data-band="2.4">2.4</button>
            <button data-band="5">5</button>
            <button data-band="6">6 GHz</button>
          </div>
          <select id="viewSel" data-i18n-title="viewLbl"></select>
        </div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="ctrldock" id="ctrlDock"><button id="btnUndo" data-i18n-title="undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button id="btnRedo" data-i18n-title="redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
      <button id="btnFit" data-i18n-title="fit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button id="btnView3d" data-i18n-title="view3d"><svg viewBox="0 0 24 24"><path d="M12 2.5l8.5 4.75v9.5L12 21.5l-8.5-4.75v-9.5z"/><path d="M3.5 7.25L12 12l8.5-4.75M12 12v9.5"/></svg></button>
      </div>
      <div class="empty-state" id="emptyState" hidden>
        <h2 data-i18n="emptyTitle"></h2>
        <p data-i18n="emptyBody"></p>
        <div class="es-actions">
          <button class="es-btn primary" data-es="plan"><b data-i18n="loadPlan"></b><small data-i18n="emptyPlanD"></small></button>
          <button class="es-btn" data-es="tpl"><b data-i18n="tplBtn"></b><small data-i18n="emptyTplD"></small></button>
          <button class="es-btn" data-es="demo"><b data-i18n="emptyDemo"></b><small data-i18n="emptyDemoD"></small></button>
        </div>
        <button class="link-btn" data-es="draw" data-i18n="emptyDraw"></button>
      </div>
      <div class="floorbar" id="floorBar"></div>
      <div class="hint" id="hint"></div>
      <button class="finish-wall" id="btnFinishWall" hidden></button>
      <button class="ortho-btn" id="btnOrtho" hidden aria-pressed="true"></button>
    </section>

    <aside class="panel">
      <section class="card" id="propsCard">
        <h3 id="propsTitle"></h3>
        <div id="props"></div>
      </section>

      <nav class="ptabs" id="pTabs" role="tablist">
        <button data-ptab="results" role="tab" data-i18n="tabResults"></button>
        <button data-ptab="settings" role="tab" data-i18n="tabSettings"></button>
        <button data-ptab="ai" role="tab" data-i18n="tabAi"></button>
      </nav>
      <section class="card" id="summaryCard" data-tab="results">
        <h3 data-i18n="summary"></h3>
        <div class="stats" id="stats"></div>
        <div class="btn-row2">
          <button class="btn" data-open="aptable" data-i18n="apTableTitle"></button>
          <button class="btn" data-open="bom" data-i18n="bomTitle"></button>
        </div>
      </section>

      <section class="card" id="calibCard" data-tab="results" hidden>
        <h3 data-i18n="calibTitle"></h3>
        <div id="calib"></div>
      </section>

      <section class="card" id="aiCard" data-tab="ai">
        <h3 data-i18n="aiTitle"></h3>
        <label class="row"><span data-i18n="aiModelUsed"></span><select id="aiModel"></select></label>
        <div id="aiModelSearchBox"></div>
        <label class="row"><span data-i18n="aiTarget"></span>
          <select id="aiTarget"><option value="0.9">90%</option><option value="0.95" selected>95%</option><option value="0.99">99%</option></select>
        </label>
        <label class="row"><span data-i18n="aiMaxAps"></span><input type="number" id="aiMax" min="1" max="50" value="12"></label>
        <label class="row check"><span data-i18n="aiKeep"></span><input type="checkbox" id="aiKeep"></label>
        <button class="btn primary" id="btnAutoPlace" data-i18n="aiAutoPlace"></button>
        <div class="progress" id="aiProgress" hidden><div></div></div>
        <button class="btn" id="btnChannels" data-i18n="aiChannels"></button>
        <button class="btn" id="btnCapacity" data-i18n="aiCapacity"></button>
      </section>

      <section class="card" id="displayCard" data-tab="settings">
        <h3 data-i18n="display"></h3>
        <label class="row"><span data-i18n="environment"></span>
          <select id="envSel"></select>
        </label>
        <label class="row"><span data-i18n="opacity"></span>
          <input type="range" id="opacity" min="0.1" max="0.9" step="0.05">
        </label>
        <label class="row"><span data-i18n="requirement"></span>
          <select id="reqSel"></select>
        </label>
        <label class="row"><span data-i18n="reqSetLbl"></span>
          <select id="reqSetSel"></select>
        </label>
        <button type="button" class="link-btn" id="reqSetEdit" data-i18n="reqSetEdit"></button>
        <label class="row check"><span data-i18n="waves"></span><input type="checkbox" id="wavesChk"></label>
        <details class="adv" id="advBox">
          <summary data-i18n="advanced"></summary>
          <label class="row"><span data-i18n="minSignal"></span>
            <select id="minSel"></select>
          </label>
          <label class="row"><span data-i18n="clientDevice"></span><select id="clientSel"></select></label>
          <label class="row"><span><span data-i18n="clientHeight"></span> <span class="u">(m)</span></span><input type="number" id="clientH" min="0" max="10" step="0.1"></label>
          <label class="row"><span data-i18n="margin"></span><select id="marginSel"></select></label>
          <label class="row"><span data-i18n="clientStd"></span><select id="clientStdSel"></select></label>
          <label class="row"><span data-i18n="clientSS"></span><select id="clientSSSel"></select></label>
          <label class="row check"><span data-i18n="pathsOpt"></span><input type="checkbox" id="pathsChk"></label>
          <label class="row"><span data-i18n="ctyLbl"></span><select id="countrySel"></select></label>
          <label class="row check"><span data-i18n="capReg"></span><input type="checkbox" id="capNbtc"></label>
          <label class="row check"><span data-i18n="dfsOpt"></span><input type="checkbox" id="dfsChk"></label>
          <label class="row check"><span data-i18n="steerOpt"></span><input type="checkbox" id="steerChk"></label>
          <label class="row check"><span data-i18n="mloOpt"></span><input type="checkbox" id="mloChk"></label>
          <label class="row check"><span data-i18n="rulers"></span><input type="checkbox" id="rulersChk"></label>
        </details>
      </section>


      <p class="disclaimer" data-tab="results" data-i18n="disclaimer"></p>
    </aside>
  </main>

  <footer class="status">
    <span id="stCursor">—</span>
    <span id="stScale"></span>
    <span id="stMsg"></span>
  </footer>

  <div class="modal-back" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" id="modalBox"></div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/i18n-pro.js"></script>
  <script src="js/i18n-pro2.js"></script>
  <script src="js/i18n-pro-zh.js"></script>
  <script src="js/i18n-pro-ja.js"></script>
  <script src="js/i18n-pro-ko.js"></script>
  <script src="js/i18n-pro-vi.js"></script>
  <script src="js/i18n-pro-lo.js"></script>
  <script src="js/i18n-pro-my.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/radio.js"></script>
  <script src="js/antenna.js"></script>
  <script src="js/model.js"></script>
  <script src="js/views.js"></script>
  <script src="js/optimizer.js"></script>
  <script src="js/survey.js"></script>
  <script src="js/report.js"></script>
  <script src="js/pdfplan.js"></script>
  <script src="js/sample.js"></script>
  <script src="js/view3d.js"></script>
  <script src="js/floors.js"></script>
  <script src="js/tables.js"></script>
  <script src="js/report-pdf.js"></script>
  <script src="js/xlsx.js"></script>
  <script src="js/docx.js"></script>
  <script src="js/export.js"></script>
  <script src="js/cad.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
